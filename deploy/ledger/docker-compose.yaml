name: sat-sa-ledger

networks:
  sat_sa_fabric:
    name: sat_sa_fabric
    driver: bridge

services:
  orderer.sat-sa.local:
    image: hyperledger/fabric-orderer:2.5.9
    container_name: orderer.sat-sa.local
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    ports:
      - "7050:7050"
      - "7053:7053"
    volumes:
      - ./crypto-config/ordererOrganizations/sat-sa.local/orderers/orderer.sat-sa.local/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/sat-sa.local/orderers/orderer.sat-sa.local/tls/:/var/hyperledger/orderer/tls
    networks:
      - sat_sa_fabric

  peer0.regulator.nciipc.gov:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.regulator.nciipc.gov
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=sat_sa_fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.regulator.nciipc.gov
      - CORE_PEER_ADDRESS=peer0.regulator.nciipc.gov:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regulator.nciipc.gov:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regulator.nciipc.gov:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regulator.nciipc.gov:7051
      - CORE_PEER_LOCALMSPID=RegulatorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    ports:
      - "7051:7051"
      - "9443:9443"
    volumes:
      - ./crypto-config/peerOrganizations/regulator.nciipc.gov/peers/peer0.regulator.nciipc.gov/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/regulator.nciipc.gov/peers/peer0.regulator.nciipc.gov/tls:/etc/hyperledger/fabric/tls
    networks:
      - sat_sa_fabric

  peer0.supervised.bank01.org:
    image: hyperledger/fabric-peer:2.5.9
    container_name: peer0.supervised.bank01.org
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=sat_sa_fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.supervised.bank01.org
      - CORE_PEER_ADDRESS=peer0.supervised.bank01.org:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.supervised.bank01.org:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.supervised.bank01.org:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.supervised.bank01.org:9051
      - CORE_PEER_LOCALMSPID=SupervisedMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    ports:
      - "9051:9051"
      - "9444:9444"
    volumes:
      - ./crypto-config/peerOrganizations/supervised.bank01.org/peers/peer0.supervised.bank01.org/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/supervised.bank01.org/peers/peer0.supervised.bank01.org/tls:/etc/hyperledger/fabric/tls
    networks:
      - sat_sa_fabric
