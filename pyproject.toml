[project]
name = "sat-sa"
version = "0.1.0"
description = "Supervisory Analytics Tool for SOC Assessment - Offline Evidence Intake Workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "safetensors>=0.4.0",
    "sqlalchemy>=2.0.30",
    "tokenizers>=0.19.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "tzdata>=2024.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "db*", "packages*", "synthetic*"]
exclude = ["storage*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
